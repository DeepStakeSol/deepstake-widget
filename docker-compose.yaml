version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      args:
        BUILDKIT_INLINE_CACHE: 0
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - ./frontend:/app
      - ./shared:/app/dist
      - ./images:/images:ro
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
      - DISABLE_BACKEND_PREFIX=${DISABLE_BACKEND_PREFIX:-false}
      - IMAGE_URL_PREFIX=${IMAGE_URL_PREFIX:-}
      - VITE_USE_LEGACY_VALIDATOR_PROFILE=${VITE_USE_LEGACY_VALIDATOR_PROFILE:-false}
      - VITE_TELEMETRY_ENDPOINT=${VITE_TELEMETRY_ENDPOINT:-https://deepstake.info/api/telemetry}
      - VITE_WIDGET_VERSION=${VITE_WIDGET_VERSION:-}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      args:
        BUILDKIT_INLINE_CACHE: 0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend:/app
      - ./shared:/shared:ro
      - ./images:/images:ro
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - SHARED_FILES_DIR=/shared
      - IMAGES_DIR=/images
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN:-}
      - TELEMETRY_STATS_TOKEN=${TELEMETRY_STATS_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
