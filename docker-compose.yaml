version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      args:
        BUILDKIT_INLINE_CACHE: 0
    ports:
      - "4173:4173"
    volumes:
      - ./frontend:/app
      - ./shared:/app/dist
      - ./images:/images:ro
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
      - DISABLE_BACKEND_PREFIX=${DISABLE_BACKEND_PREFIX:-false}
      - IMAGE_URL_PREFIX=${IMAGE_URL_PREFIX:-}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      args:
        BUILDKIT_INLINE_CACHE: 0
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - ./shared:/shared:ro
      - ./images:/images:ro
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - SHARED_FILES_DIR=/shared
      - IMAGES_DIR=/images
